name: Validate Diablo IV Data Import
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/import-d4data/**"
      - "schemas/**"
      - "package.json"
      - ".github/workflows/probe-d4data.yml"
permissions:
  contents: read
concurrency:
  group: d4data-import
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Sparse clone required d4data paths
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/DiabloTools/d4data.git .tmp/d4data
          cd .tmp/d4data
          git sparse-checkout init --no-cone
          git sparse-checkout set \
            /buildVersion.txt \
            /json/base/meta/Power/ \
            /json/base/meta/Aspect/ \
            /json/base/meta/Affix/ \
            /json/base/meta/Item/ \
            /json/base/meta/GameBalance/SkillTreeRewards.gam.json \
            /json/enUS_Text/meta/StringList/
      - name: Extract canonical PoC records
        run: npm run data:extract -- --datamine .tmp/d4data
      - name: Import all learnable skills
        run: npm run data:skills -- --datamine .tmp/d4data
      - name: Import logical skill tree
        run: npm run data:tree -- --datamine .tmp/d4data
      - name: Import all aspects
        run: npm run data:aspects -- --datamine .tmp/d4data
      - name: Import unique and mythic items
        run: npm run data:items -- --datamine .tmp/d4data
      - name: Import referenced affixes
        run: npm run data:affixes -- --datamine .tmp/d4data
      - name: Measure skill and item icon references
        run: npx tsx scripts/import-d4data/probe-icons.ts --datamine .tmp/d4data
      - name: Run tests
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d4data-proof
          path: data/generated/
          if-no-files-found: warn
