name: Probe Diablo IV Data
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Clone d4data
        run: git clone --depth 1 --filter=blob:none https://github.com/DiabloTools/d4data.git .tmp/d4data
      - name: Probe data
        run: npm run data:probe -- --datamine .tmp/d4data
      - uses: actions/upload-artifact@v4
        with:
          name: d4data-proof
          path: data/generated/
