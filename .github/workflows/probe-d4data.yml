name: Validate Diablo IV Data Import
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/import-d4data/**"
      - "schemas/**"
      - "package.json"
permissions:
  contents: read
concurrency:
  group: d4data-import
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Sparse clone required d4data paths
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/DiabloTools/d4data.git .tmp/d4data
          cd .tmp/d4data
          git sparse-checkout set \
            buildVersion.txt \
            json/base/meta/Power \
            json/base/meta/Aspect \
            json/base/meta/Affix \
            json/enUS_Text/meta/StringList
      - name: Extract canonical PoC records
        run: npm run data:extract -- --datamine .tmp/d4data
      - name: Import all learnable skills
        run: npm run data:skills -- --datamine .tmp/d4data
      - name: Run tests
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d4data-proof
          path: data/generated/
          if-no-files-found: warn
