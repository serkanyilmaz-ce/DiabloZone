name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/fetch-icons.ts"
      - "astro.config.mjs"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Restore icon cache
        uses: actions/cache@v4
        with:
          path: |
            public/assets/skills
            public/assets/items
            public/assets/icon-source-map.json
          key: d4-icons-v2-${{ github.run_id }}
          restore-keys: |
            d4-icons-v2-
      - name: Sparse clone required d4data paths
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/DiabloTools/d4data.git .tmp/d4data
          cd .tmp/d4data
          git sparse-checkout init --no-cone
          git sparse-checkout set \
            /buildVersion.txt \
            /json/base/meta/Power/ \
            /json/base/meta/Aspect/ \
            /json/base/meta/Affix/ \
            /json/base/meta/Item/ \
            /json/enUS_Text/meta/StringList/
      - name: Generate canonical game data
        run: |
          npm run data:extract -- --datamine .tmp/d4data
          npm run data:skills -- --datamine .tmp/d4data
          npm run data:aspects -- --datamine .tmp/d4data
          npm run data:items -- --datamine .tmp/d4data
          npm run data:affixes -- --datamine .tmp/d4data
      - name: Resolve and cache skill/item icons
        run: npm run data:icons
      - name: Build Astro site
        run: npm run build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
